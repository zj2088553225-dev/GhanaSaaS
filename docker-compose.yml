services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port binding — internal network only for security

  api:
    image: ${API_IMAGE:-saas-api:${IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE_DURATION: ${JWT_EXPIRE_DURATION:-24h}
      OPENAPI_LEGACY_SIGNATURE_ENABLED: ${OPENAPI_LEGACY_SIGNATURE_ENABLED:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_TIMEZONE: ${DB_TIMEZONE:-UTC}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-100}
      STOREFRONT_AUTH_ENABLED: ${STOREFRONT_AUTH_ENABLED:-false}
      CUSTOMER_PASSWORD_RESET_ENABLED: ${CUSTOMER_PASSWORD_RESET_ENABLED:-false}
      STOREFRONT_PRICE_VISIBLE: ${STOREFRONT_PRICE_VISIBLE:-false}
      PLATFORM_MALL_TENANT_ID: ${PLATFORM_MALL_TENANT_ID:-0}
      PRODUCT_POPULARITY_CACHE_TTL_SECONDS: ${PRODUCT_POPULARITY_CACHE_TTL_SECONDS:-120}
      RESERVATION_MODE: ${RESERVATION_MODE:-disabled}
      RESERVATION_CONTACT_HASH_SECRET: ${RESERVATION_CONTACT_HASH_SECRET:-}
      RESERVATION_CONTACT_ENCRYPTION_KEY: ${RESERVATION_CONTACT_ENCRYPTION_KEY:-}
      RESERVATION_BROWSER_HASH_SECRET: ${RESERVATION_BROWSER_HASH_SECRET:-}
      RESERVATION_IP_HASH_SECRET: ${RESERVATION_IP_HASH_SECRET:-}
      RESERVATION_TRUSTED_PROXY_CIDRS: ${RESERVATION_TRUSTED_PROXY_CIDRS:-}
      RESERVATION_ANONYMOUS_TTL_HOURS: ${RESERVATION_ANONYMOUS_TTL_HOURS:-24}
      RESERVATION_BROWSER_LIMIT_PER_HOUR: ${RESERVATION_BROWSER_LIMIT_PER_HOUR:-5}
      RESERVATION_BROWSER_LIMIT_PER_DAY: ${RESERVATION_BROWSER_LIMIT_PER_DAY:-20}
      RESERVATION_IP_LIMIT_PER_HOUR: ${RESERVATION_IP_LIMIT_PER_HOUR:-20}
      RESERVATION_IP_LIMIT_PER_DAY: ${RESERVATION_IP_LIMIT_PER_DAY:-100}
      RESERVATION_IP_PRODUCT_LIMIT_PER_DAY: ${RESERVATION_IP_PRODUCT_LIMIT_PER_DAY:-3}
      RESERVATION_HEAT_POPULAR_MIN: ${RESERVATION_HEAT_POPULAR_MIN:-5}
      RESERVATION_HEAT_TRENDING_MIN: ${RESERVATION_HEAT_TRENDING_MIN:-20}
      RESERVATION_HEAT_HIGHLY_REQUESTED_MIN: ${RESERVATION_HEAT_HIGHLY_REQUESTED_MIN:-50}
      RESERVATION_ATTEMPT_RETENTION_DAYS: ${RESERVATION_ATTEMPT_RETENTION_DAYS:-30}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
      TURNSTILE_EXPECTED_ACTION: ${TURNSTILE_EXPECTED_ACTION:-reservation_otp}
      TURNSTILE_VERIFY_TIMEOUT_SECONDS: ${TURNSTILE_VERIFY_TIMEOUT_SECONDS:-5}
      OTP_PROVIDER: ${OTP_PROVIDER:-mock}
      RESERVATION_OTP_CHANNELS: ${RESERVATION_OTP_CHANNELS:-sms}
      OTP_PROVIDER_TIMEOUT_SECONDS: ${OTP_PROVIDER_TIMEOUT_SECONDS:-5}
      RESERVATION_OTP_RESPONSE_MIN_MILLISECONDS: ${RESERVATION_OTP_RESPONSE_MIN_MILLISECONDS:-750}
      RESERVATION_OTP_CHALLENGE_TTL_MINUTES: ${RESERVATION_OTP_CHALLENGE_TTL_MINUTES:-10}
      RESERVATION_OTP_RESEND_COOLDOWN_SECONDS: ${RESERVATION_OTP_RESEND_COOLDOWN_SECONDS:-60}
      RESERVATION_OTP_MAX_VERIFY_ATTEMPTS: ${RESERVATION_OTP_MAX_VERIFY_ATTEMPTS:-5}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      RESERVATION_INTEREST_VISITOR_PER_MINUTE: ${RESERVATION_INTEREST_VISITOR_PER_MINUTE:-20}
      RESERVATION_INTEREST_IP_PER_MINUTE: ${RESERVATION_INTEREST_IP_PER_MINUTE:-60}
      RESERVATION_INTEREST_GLOBAL_PER_MINUTE: ${RESERVATION_INTEREST_GLOBAL_PER_MINUTE:-1000}
      RESERVATION_OTP_CONTACT_PER_30_MIN: ${RESERVATION_OTP_CONTACT_PER_30_MIN:-3}
      RESERVATION_OTP_CONTACT_PER_DAY: ${RESERVATION_OTP_CONTACT_PER_DAY:-5}
      RESERVATION_OTP_VISITOR_PER_HOUR: ${RESERVATION_OTP_VISITOR_PER_HOUR:-5}
      RESERVATION_OTP_IP_PER_HOUR: ${RESERVATION_OTP_IP_PER_HOUR:-20}
      RESERVATION_OTP_GLOBAL_PER_MINUTE: ${RESERVATION_OTP_GLOBAL_PER_MINUTE:-100}
      RESERVATION_VERIFY_VISITOR_PER_10_MIN: ${RESERVATION_VERIFY_VISITOR_PER_10_MIN:-15}
      RESERVATION_VERIFY_IP_PER_10_MIN: ${RESERVATION_VERIFY_IP_PER_10_MIN:-50}
      RESERVATION_VERIFY_GLOBAL_PER_MINUTE: ${RESERVATION_VERIFY_GLOBAL_PER_MINUTE:-500}
      RESERVATION_CANCEL_IP_PER_MINUTE: ${RESERVATION_CANCEL_IP_PER_MINUTE:-60}
      RESERVATION_CANCEL_GLOBAL_PER_MINUTE: ${RESERVATION_CANCEL_GLOBAL_PER_MINUTE:-1000}
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
      - saas-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O - http://127.0.0.1:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-saas-web:${IMAGE_TAG:-local}}
    build:
      context: ./saas-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_STOREFRONT_AUTH_ENABLED: ${VITE_STOREFRONT_AUTH_ENABLED:-false}
        VITE_CUSTOMER_PASSWORD_RESET_ENABLED: ${VITE_CUSTOMER_PASSWORD_RESET_ENABLED:-false}
        VITE_STOREFRONT_PRICE_VISIBLE: ${VITE_STOREFRONT_PRICE_VISIBLE:-false}
        VITE_ADMIN_BASE_PATH: ${VITE_ADMIN_BASE_PATH:-/gc-control-7x}
        VITE_MERCHANT_WHATSAPP_URL: ${VITE_MERCHANT_WHATSAPP_URL:-}
        VITE_RESERVATION_MODE: ${VITE_RESERVATION_MODE:-disabled}
        VITE_TURNSTILE_ENABLED: ${VITE_TURNSTILE_ENABLED:-false}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_GOOGLE_MAPS_EMBED_KEY: ${VITE_GOOGLE_MAPS_EMBED_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - saas-uploads:/usr/share/nginx/uploads:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  saas-uploads:
